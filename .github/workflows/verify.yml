name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Regenerate the deterministic sample
        run: node tools/gen-sample.mjs
      - name: Assert the exact-orientation result
        run: node bench/verify.mjs
